$NetBSD: patch-rollup_rust_bindings__napi_Cargo.toml,v 1.10 2026/08/09 06:31:20 kikadf Exp $

* Part of patchset to build chromium on NetBSD
* Based on OpenBSD's chromium patches, and
  pkgsrc's qt5-qtwebengine patches

--- rollup/rust/bindings_napi/Cargo.toml.orig	2026-05-14 17:17:51.000000000 +0000
+++ rollup/rust/bindings_napi/Cargo.toml
@@ -15,7 +15,7 @@ napi-derive = "3.5.5"
 parse_ast = { path = "../parse_ast" }
 xxhash = { path = "../xxhash" }
 
-[target.'cfg(not(any(target_os = "linux", target_os = "freebsd")))'.dependencies]
+[target.'cfg(not(any(target_os = "linux", target_os = "freebsd", target_os = "openbsd", target_os = "netbsd")))'.dependencies]
 mimalloc-safe = { version = "0.1.58" }
 
 # Readable version of the target specifier
@@ -33,7 +33,7 @@ mimalloc-safe = { version = "0.1.58" }
 # 		)
 # 	)
 # )
-[target.'cfg(any(all(target_os = "linux", not(target_arch = "loongarch64"), not(all(target_arch = "riscv64", target_env = "musl")), not(target_env = "ohos")), all(target_os = "freebsd", not(target_arch = "aarch64"))))'.dependencies]
+[target.'cfg(any(all(target_os = "linux", not(target_arch = "loongarch64"), not(all(target_arch = "riscv64", target_env = "musl")), not(target_env = "ohos")), all(target_os = "openbsd", not(target_arch = "aarch64")), all(target_os = "freebsd", not(target_arch = "aarch64")), all(target_os = "netbsd", not(target_arch = "evbarm"))))'.dependencies]
 mimalloc-safe = { version = "0.1.58", features = ["local_dynamic_tls"] }
 
 # Disable architecture specific optimizations on aarch64 platforms
