$NetBSD: patch-conf.d_60-latin.conf,v 1.1 2026/11/11 09:44:45 nia Exp $

Adjust default preference order to prefer Bitstream Vera and Liberation
fonts over the Luxi Type1 fonts, which freetype struggles to render.
Helps make the default text rendering better in e.g.  GTK applications
and web browsers.

Luxi Type1 fonts are otherwise the only fonts in this list shipped with
X11 as standard.

PR xsrc/60991: fontconfig prefers Luxi Type1 fonts for Latin text, which
are extremely ugly

--- conf.d/60-latin.conf.orig	2026-08-06 06:05:15.000000000 +0000
+++ conf.d/60-latin.conf
@@ -9,7 +9,8 @@
 			<family>DejaVu Serif</family>
 			<family>Times New Roman</family>
 			<family>Thorndale AMT</family>
-			<family>Luxi Serif</family>
+			<family>Bitstream Vera Serif</family>
+			<family>Liberation Serif</family>
 			<family>Nimbus Roman No9 L</family>
 			<family>Nimbus Roman</family>
 			<family>Times</family>
@@ -23,7 +24,8 @@
 			<family>Verdana</family>
 			<family>Arial</family>
 			<family>Albany AMT</family>
-			<family>Luxi Sans</family>
+			<family>Bitstream Vera Sans</family>
+			<family>Liberation Sans</family>
 			<family>Nimbus Sans L</family>
 			<family>Nimbus Sans</family>
 			<family>Helvetica</family>
@@ -41,7 +43,8 @@
 			<family>Andale Mono</family>
 			<family>Courier New</family>
 			<family>Cumberland AMT</family>
-			<family>Luxi Mono</family>
+			<family>Bitstream Vera Sans Mono</family>
+			<family>Liberation Mono</family>
 			<family>Nimbus Mono L</family>
 			<family>Nimbus Mono</family>
 			<family>Nimbus Mono PS</family>
@@ -77,13 +80,11 @@ -->
 	<alias>
 		<family>system-ui</family>
 		<prefer>
-			<family>Adwaita Sans</family>
 			<family>Cantarell</family>
 			<family>Noto Sans UI</family>
 			<family>Segoe UI</family>
 			<family>Segoe UI Historic</family>
 			<family>Segoe UI Symbol</family>
-			<family>Noto Sans</family><!-- fallback -->
 		</prefer>
 	</alias>
 
