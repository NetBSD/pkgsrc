$NetBSD: patch-pyproject.toml,v 1.1 2026/08/12 21:47:29 wiz Exp $

Support flit 4.

--- pyproject.toml.orig	2026-08-12 21:45:54.476310221 +0000
+++ pyproject.toml
@@ -1,20 +1,16 @@
 [build-system]
-requires = ["flit_core >=2,<4"]
+requires = ["flit_core >=3.2,<5"]
 build-backend = "flit_core.buildapi"
 
-# TODO: replace the following section by the standard [project] section to be able
-# to use flit v4.
-[tool.flit.metadata]
-module = "threadpoolctl"
-author = "Thomas Moreau"
-author-email = "thomas.moreau.2010@gmail.com"
-home-page = "https://github.com/joblib/threadpoolctl"
-description-file = "README.md"
+[project]
+name = "threadpoolctl"
+authors = [{name = "Thomas Moreau", email = "thomas.moreau.2010@gmail.com"}]
+readme = "README.md"
 requires-python = ">=3.9"
 license = "BSD-3-Clause"
+dynamic = ["version", "description"]
 classifiers = [
     "Intended Audience :: Developers",
-    "License :: OSI Approved :: BSD License",
     "Programming Language :: Python :: 3",
     "Programming Language :: Python :: 3.9",
     "Programming Language :: Python :: 3.10",
@@ -23,6 +19,9 @@ classifiers = [
     "Programming Language :: Python :: 3.13",
     "Topic :: Software Development :: Libraries :: Python Modules",
 ]
+
+[project.urls]
+homepage = "https://github.com/joblib/threadpoolctl"
 
 [tool.black]
 line-length = 88
